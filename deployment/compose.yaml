name: ai-agent-builder

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  secret-bootstrap:
    image: alpine:3.22.2
    restart: 'no'
    command: ['/bin/sh', '/bootstrap/bootstrap-secrets.sh']
    volumes:
      - ./bootstrap:/bootstrap:ro
      - local_secrets:/secrets
    network_mode: none
    logging: *default-logging

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_builder}
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD_FILE: /run/local-secrets/postgres_admin_password
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_platform_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
      - local_secrets:/run/local-secrets:ro
    depends_on:
      secret-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform_admin -d ${POSTGRES_DB:-agent_builder}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - agent_builder

  redis-cache:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - ${REDIS_CACHE_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - '127.0.0.1:${REDIS_CACHE_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging
    networks:
      - agent_builder

  redis-queue:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - '127.0.0.1:${REDIS_QUEUE_PORT:-6381}:6379'
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging
    networks:
      - agent_builder

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.config=/run/local-secrets/seaweed/seaweed-s3.json
      - -s3.iam=false
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333'
    volumes:
      - seaweedfs_data:/data
      - local_secrets:/run/local-secrets:ro
    depends_on:
      secret-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:9333/cluster/status >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging: *default-logging
    networks:
      - agent_builder

  bucket-bootstrap:
    image: chrislusf/seaweedfs:4.53
    restart: 'no'
    entrypoint: ['/bin/sh', '/bootstrap/bootstrap-buckets.sh']
    environment:
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-agent-documents}
      S3_BUCKET_OUTPUTS: ${S3_BUCKET_OUTPUTS:-agent-outputs}
      S3_BUCKET_BACKUPS: ${S3_BUCKET_BACKUPS:-agent-backups}
    volumes:
      - ./storage:/bootstrap:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    logging: *default-logging
    networks:
      - agent_builder

  migration:
    image: ai-agent-builder-backend:local
    build:
      context: ..
      dockerfile: deployment/docker/backend.Dockerfile
      target: production
    restart: 'no'
    command: ['node', 'backend/dist/database/migrations/migrate.js']
    environment:
      MIGRATION_DATABASE_URL_FILE: /run/local-secrets/backend/migration_database_url
    volumes:
      - local_secrets:/run/local-secrets:ro
    depends_on:
      secret-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - agent_builder

  backend:
    image: ai-agent-builder-backend:local
    build:
      context: ..
      dockerfile: deployment/docker/backend.Dockerfile
      target: production
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL_FILE: /run/local-secrets/backend/database_url
      CACHE_REDIS_URL: redis://redis-cache:6379
      QUEUE_REDIS_URL: redis://redis-queue:6379
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_FILE: /run/local-secrets/backend/s3_access_key
      S3_SECRET_KEY_FILE: /run/local-secrets/backend/s3_secret_key
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-agent-documents}
      S3_BUCKET_OUTPUTS: ${S3_BUCKET_OUTPUTS:-agent-outputs}
    volumes:
      - local_secrets:/run/local-secrets:ro
    ports:
      - '${API_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      bucket-bootstrap:
        condition: service_completed_successfully
    logging: *default-logging
    stop_grace_period: 15s
    networks:
      - agent_builder

  frontend:
    build:
      context: ..
      dockerfile: deployment/docker/frontend.Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    stop_grace_period: 15s
    networks:
      - agent_builder

  quality:
    profiles: [quality]
    build:
      context: ..
      dockerfile: deployment/docker/backend.Dockerfile
      target: development
    init: true
    command: sh -c "npm run ai:sync && npm run quality"
    network_mode: none
    environment:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: 1
    logging: *default-logging

networks:
  agent_builder:
    driver: bridge

volumes:
  local_secrets:
  postgres_platform_data:
  redis_queue_data:
  seaweedfs_data:
